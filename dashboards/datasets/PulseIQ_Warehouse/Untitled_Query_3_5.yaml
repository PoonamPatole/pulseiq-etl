catalog: pulseiq_wh
schema: dw
sql: "SELECT\r\n    DATE_TRUNC('month', d.full_date)::date AS month,\r\n    ROUND(\r\
  \n        100.0 * COUNT(*) FILTER (\r\n            WHERE a.status IN ('PRESENT',\
  \ 'WFH')\r\n        ) / NULLIF(COUNT(*), 0),\r\n        1\r\n    ) AS attendance_rate_pct,\r\
  \n    COUNT(*) FILTER (WHERE a.late_flag = 1) AS late_arrivals\r\nFROM dw.fact_attendance\
  \ a\r\nJOIN dw.dim_date d ON a.date_key = d.date_key\r\nGROUP BY 1\r\nORDER BY 1;"
