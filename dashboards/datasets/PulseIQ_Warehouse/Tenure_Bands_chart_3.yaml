catalog: pulseiq_wh
schema: dw
sql: "SELECT\r\n    CASE\r\n        WHEN AGE(CURRENT_DATE, hire_date) < INTERVAL '1\
  \ year' THEN '0\u20131 years'\r\n        WHEN AGE(CURRENT_DATE, hire_date) < INTERVAL\
  \ '3 years' THEN '1\u20133 years'\r\n        WHEN AGE(CURRENT_DATE, hire_date) <\
  \ INTERVAL '5 years' THEN '3\u20135 years'\r\n        WHEN AGE(CURRENT_DATE, hire_date)\
  \ < INTERVAL '10 years' THEN '5\u201310 years'\r\n        ELSE '10+ years'\r\n \
  \   END AS tenure_band,\r\n    COUNT(DISTINCT employee_id) AS employee_count\r\n\
  FROM dw.dim_employee\r\nWHERE is_current = TRUE\r\n  AND employment_status = 'Active'\r\
  \n  AND hire_date IS NOT NULL\r\nGROUP BY 1\r\nORDER BY MIN(hire_date);"
