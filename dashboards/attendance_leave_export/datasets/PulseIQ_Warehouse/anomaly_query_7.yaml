catalog: pulseiq_wh
schema: dw
sql: "SELECT\r\n    DATE_TRUNC('month', d.full_date)::date AS month,\r\n    ROUND(\r\
  \n        100.0 * COUNT(*) FILTER (\r\n            WHERE a.status IN ('PRESENT',\
  \ 'WFH')\r\n        ) / NULLIF(COUNT(*), 0),\r\n        1\r\n    ) AS attendance_rate_pct,\r\
  \n    COUNT(DISTINCT f.result_id) FILTER (\r\n        WHERE f.flagged = 'Y'\r\n\
  \    ) AS flagged_anomalies\r\nFROM dw.fact_attendance a\r\nJOIN dw.dim_date d ON\
  \ a.date_key = d.date_key\r\nLEFT JOIN dw.fact_anomaly f\r\n    ON f.source_dataset\
  \ = 'attendance_monthly_features'\r\n   AND DATE_TRUNC('month', f.period)::date\
  \ =\r\n       DATE_TRUNC('month', d.full_date)::date\r\nGROUP BY 1\r\nORDER BY 1;"
