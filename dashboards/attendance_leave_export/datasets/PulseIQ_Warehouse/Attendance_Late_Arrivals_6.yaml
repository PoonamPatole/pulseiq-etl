sql: "SELECT\r\n    DATE_TRUNC('month', d.full_date)::date AS month,\r\n    COUNT(*)\
  \ FILTER (WHERE a.late_flag = 1) AS late_arrivals\r\nFROM dw.fact_attendance a\r\
  \nJOIN dw.dim_date d ON a.date_key = d.date_key\r\nGROUP BY 1\r\nORDER BY 1;"
